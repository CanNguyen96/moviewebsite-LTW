<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E38" />
      <stop offset="100%" stop-color="#B30006" />
    </linearGradient>
    
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E0E0" />
    </linearGradient>

    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(5, 5)">
    <!-- Big Bold A -->
    <text x="0" y="52" font-family="Impact, 'Arial Black', sans-serif" font-size="54" font-weight="900" fill="url(#redGrad)" filter="url(#redGlow)">A</text>

    <!-- Sharp stylized Z -->
    <path d="M 40,12 L 85,12 L 52,47 L 85,47 L 85,54 L 40,54 L 73,19 L 40,19 Z" fill="url(#redGrad)" filter="url(#redGlow)" />
    
    <!-- Accent Ribbon inside Z -->
    <path d="M 52,14 L 78,14 L 62,33 Z" fill="#FF6B72" opacity="0.8" />

    <!-- sub in clean modern white font -->
    <text x="90" y="52" font-family="System-UI, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" fill="url(#whiteGrad)">sub</text>

    <!-- Red Tagline -->
    <text x="2" y="70" font-family="System-UI, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#FF2E38" letter-spacing="3.2">ANIME VIETSUB ONLINE</text>
  </g>
</svg>
